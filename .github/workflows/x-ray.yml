name: Build OreHighlight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ore-highlight-mod.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
          build-root-directory: ore-highlight-mod
      - run: gradle --no-daemon build
        working-directory: ore-highlight-mod
      - uses: actions/upload-artifact@v4
        with:
          name: OreHighlight
          path: ore-highlight-mod/build/libs/orehighlight-1.0.0.jar
